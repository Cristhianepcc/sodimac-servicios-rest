# Analisis de calidad de codigo (criterio 8 de la rubrica del proyecto).
#
# Uso:
#   docker run --rm --network host \
#     -v "$PWD:/usr/src" -e SONAR_TOKEN=<token> \
#     sonarsource/sonar-scanner-cli
sonar.projectKey=sodimac-servicios-rest
sonar.projectName=Sodimac Servicios REST
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.14

# Excluir el entorno virtual y artefactos de ejecucion
sonar.exclusions=.venv/**,**/__pycache__/**,.pytest_cache/**
