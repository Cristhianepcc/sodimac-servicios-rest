services:
  postgres:
    image: postgres:16-alpine
    container_name: sodimac_postgres
    environment:
      POSTGRES_USER: sodimac
      POSTGRES_PASSWORD: sodimac
      POSTGRES_DB: reabastecimiento
    ports:
      # 5433 en el host: el 5432 suele estar ocupado por un PostgreSQL nativo.
      # Dentro de la red de Docker el contenedor sigue escuchando en 5432.
      - "5433:5432"
    volumes:
      - sodimac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sodimac -d reabastecimiento"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sodimac_pgdata:
