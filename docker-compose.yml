services:
  postgres:
    image: postgres:16-alpine
    container_name: sodimac_postgres
    environment:
      POSTGRES_USER: sodimac
      POSTGRES_PASSWORD: sodimac
      POSTGRES_DB: reabastecimiento
    ports:
      - "5432:5432"
    volumes:
      - sodimac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sodimac -d reabastecimiento"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sodimac_pgdata:
