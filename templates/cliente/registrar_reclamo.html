{% extends "dashboard.html" %}
{% block title %}Registrar Reclamo{% endblock %}
{% block menu %}
<a class="nav-link active" href="{{ url_for('postventa_web.cliente_registrar') }}">Registrar Reclamo</a>
<a class="nav-link" href="{{ url_for('postventa_web.cliente_reclamos') }}">Mis Reclamos</a>
{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Registrar Reclamo</h1>
</div>
<div id="alerta" class="alert d-none"></div>
<form id="form-reclamo" class="form-card">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label" for="cliente">Cliente</label>
      <input class="form-control" id="cliente" name="cliente" value="{{ session.usuario.nombre_usuario }}" required>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="dni">DNI</label>
      <input class="form-control" id="dni" name="dni" required>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" name="email" type="email" required>
    </div>
    <div class="col-md-6">
      <label class="form-label" for="telefono">Telefono</label>
      <input class="form-control" id="telefono" name="telefono" required>
    </div>
    <div class="col-md-12">
      <label class="form-label" for="producto">Producto</label>
      <input class="form-control" id="producto" name="producto" required>
    </div>
    <div class="col-12">
      <label class="form-label" for="motivo">Motivo</label>
      <textarea class="form-control" id="motivo" name="motivo" rows="4" required></textarea>
    </div>
  </div>
  <button class="btn btn-primary mt-4" type="submit">Registrar</button>
</form>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/cliente.js') }}"></script>
{% endblock %}
